<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAiGE - Command Center Admin Login</title>
  
  <link rel="apple-touch-icon" href="../assets/apple-touch-logo.png">
  <link rel="icon" type="image/png" href="../assets/apple-touch-logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Minimal Header for Authentication */
    header {
      background-color: #000000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 3rem;
      border-bottom: 1px solid #1a1a1a;
    }

    .logo-container { flex: 1; display: flex; align-items: center; }
    .logo-img { height: 48px; width: auto; object-fit: contain; }

    .back-to-site {
      color: #a1a1aa;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.2s ease;
    }

    .back-to-site:hover { color: #80E600; }

    /* Main Section Centered Layout */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-card {
      background: #0d0d0d;
      border: 1px solid #1f1f1f;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(128, 230, 0, 0.08);
      border: 1px solid rgba(128, 230, 0, 0.3);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 800;
      color: #80E600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .login-header h1 {
      font-size: 1.75rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .login-header p {
      color: #71717a;
      font-size: 0.88rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #a1a1aa;
    }

    .forgot-link {
      font-size: 0.75rem;
      color: #80E600;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }

    .forgot-link:hover { opacity: 0.8; text-decoration: underline; }

    .form-input {
      width: 100%;
      background-color: #121212;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input:focus {
      border-color: #80E600;
      box-shadow: 0 0 10px rgba(128, 230, 0, 0.15);
    }

    .btn-login {
      width: 100%;
      background-color: #80E600;
      color: #050505;
      font-weight: 900;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 1rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px rgba(128, 230, 0, 0.2);
      margin-top: 1rem;
    }

    .btn-login:hover {
      background-color: #92fc00;
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(128, 230, 0, 0.4);
    }

    /* System Notice Placeholder */
    .system-notice {
      margin-top: 2rem;
      padding: 0.85rem;
      background: #121212;
      border: 1px dashed #2a2a2a;
      border-radius: 8px;
      text-align: center;
      font-size: 0.78rem;
      color: #71717a;
      line-height: 1.4;
    }

    /* Footer */
    footer {
      background-color: #0d0d0d;
      border-top: 1px solid #1f1f1f;
      padding: 1.5rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #52525b;
      font-size: 0.8rem;
    }

    footer a { color: #52525b; text-decoration: none; }
    footer a:hover { color: #a1a1aa; }

    @media (max-width: 600px) {
      header { padding: 1.25rem 1.5rem; }
      footer { flex-direction: column; gap: 1rem; text-align: center; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <a href="../index.html">
        <img src="../assets/apple-touch-logo.png" alt="PAiGE Logo" class="logo-img" />
      </a>
    </div>

    <a href="../index.html" class="back-to-site">
      <i class="fa-solid fa-arrow-left"></i> Back to Main Site
    </a>
  </header>

  <main>
    <div class="login-card">
      <div class="login-header">
        <div class="category-badge"><i class="fa-solid fa-lock"></i> Operational Access</div>
        <h1>Command Center</h1>
        <p>Sign in to manage plant floor alerting &amp; devices</p>
      </div>

      <form id="adminLoginForm" onsubmit="event.preventDefault(); handleLogin();">
        <div class="form-group">
          <label for="adminEmail">Email Address</label>
          <input type="email" id="adminEmail" class="form-input" placeholder="admin@company.com" required />
        </div>

        <div class="form-group">
          <div class="form-label-row">
            <label for="adminPassword">Password</label>
            <a href="#" class="forgot-link" onclick="alert('Password reset instructions will be sent once user accounts are activated.')">Forgot?</a>
          </div>
          <input type="password" id="adminPassword" class="form-input" placeholder="••••••••••••" required />
        </div>

        <button type="submit" class="btn-login">Sign In</button>
      </form>

      <div class="system-notice">
        <i class="fa-solid fa-shield-halved" style="color: #80E600; margin-right: 4px;"></i>
        <strong>System Notice:</strong> Active deployment mode. User registration is currently restricted to authorized plant administrators.
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 PAiGE Link LLC. All rights reserved.</p>
    <div style="display: flex; gap: 1.5rem;">
      <a href="../index.html#privacy">Privacy Policy</a>
      <a href="../contact/index.html">Support</a>
    </div>
  </footer>

  <script>
    function handleLogin() {
      // Temporary placeholder alert since user accounts aren't active yet
      alert("Command Center is currently in demo mode. Authentication routes will activate during your scheduled pilot.");
    }
  </script>

</body>
</html>
