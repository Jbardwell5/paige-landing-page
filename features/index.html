<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAiGE - System Features &amp; Operational Capabilities</title>
  
  <link rel="apple-touch-icon" href="../assets/apple-touch-logo.png">
  <link rel="icon" type="image/png" href="../assets/apple-touch-logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Navigation Bar */
    header {
      background-color: #000000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 3rem;
      border-bottom: 1px solid #1a1a1a;
    }

    .logo-container { flex: 1; display: flex; align-items: center; }
    .logo-img { height: 48px; width: auto; object-fit: contain; }

    .header-main-nav { display: flex; align-items: center; justify-content: center; gap: 2.5rem; flex: 1; }
    .header-utility-nav { display: flex; align-items: center; justify-content: flex-end; flex: 1; }

    .nav-link {
      color: #a1a1aa;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    .nav-link:hover, .nav-link.active { color: #80E600; }

    .nav-link-admin {
      color: #71717a;
      text-decoration: none;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.2s ease;
      opacity: 0.85;
    }

    .nav-link-admin:hover { color: #ffffff; opacity: 1; }

    /* Page Container */
    main {
      flex: 1;
      max-width: 1280px;
      margin: 0 auto;
      padding: 4rem 2rem;
      width: 100%;
    }

    /* Hero Section */
    .features-hero {
      text-align: center;
      max-width: 800px;
      margin: 0 auto 5rem auto;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(128, 230, 0, 0.08);
      border: 1px solid rgba(128, 230, 0, 0.3);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      color: #80E600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .features-hero h1 {
      font-size: clamp(2.2rem, 4vw, 3.2rem);
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 1.25rem;
      letter-spacing: -0.02em;
    }

    .features-hero p {
      color: #a1a1aa;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    /* Grid Layout */
    .capabilities-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem;
      margin-bottom: 5rem;
    }

    .feature-card {
      background: #0d0d0d;
      border: 1px solid #1f1f1f;
      border-radius: 16px;
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.25 ease, transform 0.2s ease;
    }

    .feature-card:hover {
      border-color: rgba(128, 230, 0, 0.4);
      transform: translateY(-3px);
    }

    .card-icon {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: rgba(128, 230, 0, 0.1);
      border: 1px solid rgba(128, 230, 0, 0.2);
      color: #80E600;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      margin-bottom: 1.5rem;
    }

    .feature-card h3 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
    }

    .feature-card p {
      color: #71717a;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    /* Status Indicators for LED Card */
    .led-indicators {
      display: flex;
      gap: 1rem;
      background: #121212;
      padding: 0.85rem 1.25rem;
      border-radius: 8px;
      border: 1px solid #222;
    }

    .led-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #a1a1aa;
    }

    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot-green { background-color: #80E600; box-shadow: 0 0 8px #80E600; }
    .dot-amber { background-color: #ffb703; box-shadow: 0 0 8px #ffb703; }
    .dot-red { background-color: #ff0055; box-shadow: 0 0 8px #ff0055; }

    /* Interactive Preview Block */
    .interactive-preview {
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 20px;
      padding: 3rem 2rem;
      text-align: center;
    }

    .preview-placeholder {
      width: 100%;
      max-width: 900px;
      height: 400px;
      margin: 2rem auto 0 auto;
      background: radial-gradient(circle, #152207 0%, #050505 80%);
      border: 1px dashed #2a2a2a;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      color: #71717a;
    }

    /* Footer */
