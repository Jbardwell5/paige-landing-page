<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAIGE - Coming Soon</title>
  
  <!-- Apple Touch Icon & Favicon -->
  <link rel="apple-touch-icon" href="apple-touch-logo.png">
  <link rel="icon" type="image/png" href="apple-touch-logo.png">

  <!-- Inter Font (Matches original typography) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome CDN for Social Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Navigation Bar */
    header {
      background-color: #161616;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid #222222;
    }

    .logo-container {
      flex: 1;
      display: flex;
      justify-content: center;
      padding-left: 14rem; /* Offsets top-right navigation items to keep logo centered */
    }

    .logo-img {
      height: 75px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    /* Header Navigation Right Group */
    .header-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .social-icon {
      color: #71717a;
      font-size: 1.25rem;
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .social-icon:hover {
      color: #ffffff;
      transform: translateY(-1px);
    }

    .nav-link {
      color: #71717a;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s ease;
      margin-left: 0.5rem;
    }

    .nav-link:hover {
      color: #ffffff;
    }

    /* Main Content Layout */
    main {
      flex: 1;
      display: flex;
      flex-direction: row;
      min-height: calc(100vh - 80px);
    }

    /* Left Column: Typography matching source image */
    .hero-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 4rem 5%;
      z-index: 2;
    }

    .hero-content h1 {
      font-size: clamp(3.5rem, 6.5vw, 6rem);
      font-weight: 800;
      line-height: 0.95;
      margin-bottom: 1.75rem;
      letter-spacing: -0.04em; /* Tight kerning to match image */
      color: #ffffff;
    }

    .hero-content h2 {
      color: #80E600; /* Exact vibrant green from source */
      font-size: clamp(1.5rem, 2.75vw, 2.5rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em; /* Tight kerning */
      max-width: 620px;
    }

    /* Right Column: Hero Image */
    .hero-image-container {
      flex: 1;
      position: relative;
      background-color: #0d0d0d;
      overflow: hidden;
      min-height: 400px;
    }

    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      header {
        padding: 1rem 1.5rem;
        flex-direction: column;
        gap: 1rem;
      }
      
      .logo-container {
        padding-left: 0;
      }

      .header-right {
        gap: 1.25rem;
      }

      main {
        flex-direction: column;
      }

      .hero-content {
        padding: 4rem 2rem;
        align-items: center;
        text-align: center;
      }

      .hero-image-container {
        min-height: 350px;
      }
    }
  </style>
</head>
<body>

  <!-- Header Navigation -->
  <header>
    <div class="logo-container">
      <a href="#">
        <img src="apple-touch-logo.png" alt="PAiGE Logo" class="logo-img" />
      </a>
    </div>

    <div class="header-right">
      <!-- Social Media Links (Replace '#' with your specific social media profile URLs) -->
      <div class="social-links">
        <a href="https://x.com/yourhandle" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="X (Twitter)">
          <i class="fa-brands fa-x-twitter"></i>
        </a>
        <a href="https://youtube.com/@yourchannel" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="YouTube">
          <i class="fa-brands fa-youtube"></i>
        </a>
        <a href="https://instagram.com/yourhandle" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://linkedin.com/company/yourcompany" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="LinkedIn">
          <i class="fa-brands fa-linkedin-in"></i>
        </a>
      </div>

      <a href="#login" class="nav-link">Login</a>
    </div>
  </header>

  <!-- Split Hero Section -->
  <main>
    <!-- Left Column -->
    <section class="hero-content">
      <h1>Coming Soon</h1>
      <h2>Modernizing Frontline &amp; Industrial Floor Communication</h2>
    </section>

    <!-- Right Column -->
    <section class="hero-image-container">
      <img src="hero-photo.jpg" alt="Industrial floor communication" class="hero-image" />
    </section>
  </main>

</body>
</html>
