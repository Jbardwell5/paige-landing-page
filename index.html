<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAiGE - Frontline &amp; Industrial Communications</title>
  
  <!-- Apple Touch Icon & Favicon -->
  <link rel="apple-touch-icon" href="apple-touch-logo.png">
  <link rel="icon" type="image/png" href="apple-touch-logo.png">

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome CDN for Social Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Header Navigation */
    header {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0.75rem 2rem;
      border-bottom: 1px solid #1a1a1a;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-img {
      height: 100px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    /* Main Content Layout */
    main {
      flex: 1;
      display: flex;
      flex-direction: row;
      min-height: calc(100vh - 110px);
      width: 100%;
    }

    /* Left Column: Hero Content Block */
    .hero-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center; /* Centers the inner wrapper within the 50% column */
      padding: 3rem 4%;
      z-index: 2;
    }

    /* Inner Wrapper to keep elements left-aligned relative to each other */
    .hero-text-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      max-width: 620px;
      width: 100%;
    }

    /* "Coming Soon" (~10% scaled down from previous clamp) */
    .hero-text-block h1 {
      font-size: clamp(3.6rem, 6.75vw, 6.2rem);
      font-weight: 800;
      line-height: 0.95;
      margin-bottom: 1.5rem;
      letter-spacing: -0.04em;
      color: #ffffff;
    }

    .hero-text-block h2 {
      color: #80E600;
      font-size: clamp(1.5rem, 2.5vw, 2.3rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    /* Form Bubble */
    .email-signup-form {
      margin-top: 2.25rem;
      display: flex;
      align-items: center;
      background-color: #161616;
      border: 1px solid #333333;
      border-radius: 50px;
      padding: 0.35rem 0.35rem 0.35rem 1.25rem;
      width: 100%;
      max-width: 480px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .email-signup-form:focus-within {
      border-color: #80E600;
      box-shadow: 0 0 12px rgba(128, 230, 0, 0.2);
    }

    .email-input {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 500;
      width: 100%;
    }

    .email-input::placeholder {
      color: #666666;
    }

    .submit-btn {
      background-color: #80E600;
      color: #050505;
      border: none;
      border-radius: 40px;
      padding: 0.75rem 1.75rem;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      white-space: nowrap;
    }

    .submit-btn:hover {
      background-color: #92fc00;
      transform: scale(1.02);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    /* Right Column: Hero Image */
    .hero-image-container {
      flex: 1;
      position: relative;
      background-color: #050505;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 500px;
      padding: 1.5rem 1rem 1.5rem 0;
    }

    .hero-image {
      width: 100%;
      max-width: 98%;
      height: 100%;
      max-height: 92vh;
      object-fit: contain;
      object-position: right center;
      display: block;
    }

    /* Footer Section */
    footer {
      width: 100%;
      background-color: #0d0d0d;
      border-top: 1px solid #1f1f1f;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .footer-banner-container {
      width: 100%;
      background-color: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem 1rem;
      border-bottom: 1px solid #1a1a1a;
    }

    .footer-banner-img {
      width: 100%;
      max-width: 1200px;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .footer-brand-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.75rem 1.5rem 1rem 1.5rem;
      background-color: #0d0d0d;
      gap: 1rem;
    }

    .footer-green-logo {
      height: 125px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .social-icon {
      color: #71717a;
      font-size: 1.25rem;
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .social-icon:hover {
      color: #ffffff;
      transform: translateY(-2px);
    }

    .footer-bottom {
      width: 100%;
      max-width: 1200px;
      padding: 1rem 2rem 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #52525b;
      font-size: 0.8rem;
      border-top: 1px solid #18181b;
    }

    .footer-bottom-links {
      display: flex;
      gap: 1.25rem;
    }

    .footer-bottom-links a {
      color: #52525b;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-bottom-links a:hover {
      color: #a1a1aa;
    }

    /* Responsive Adjustments */
    @media (max-width: 900px) {
      main {
        flex-direction: column;
      }

      .hero-content {
        padding: 3rem 1.5rem;
      }

      .hero-text-block {
        align-items: center;
        text-align: center;
      }

      .hero-image-container {
        min-height: 380px;
        padding: 1rem;
        justify-content: center;
      }

      .hero-image {
        max-width: 100%;
        object-position: center;
      }

      .footer-bottom {
        flex-direction: column;
        gap: 0.75rem;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Minimal Header Navigation -->
  <header>
    <div class="logo-container">
      <a href="#">
        <img src="apple-touch-logo.png" alt="PAiGE Logo" class="logo-img" />
      </a>
    </div>
  </header>

  <!-- Split Hero Section -->
  <main>
    <!-- Left Column -->
    <section class="hero-content">
      <div class="hero-text-block">
        <h1>Coming Soon</h1>
        <h2>Modernizing Frontline &amp; Industrial Floor Communication</h2>

        <!-- Email Capture Form -->
        <form class="email-signup-form" id="leadForm">
          <input 
            type="email" 
            id="emailInput"
            class="email-input" 
            placeholder="Enter your email to learn more..." 
            required 
          />
          <button type="submit" class="submit-btn" id="submitBtn">CONTACT</button>
        </form>
      </div>
    </section>

    <!-- Right Column -->
    <section class="hero-image-container">
      <img 
        src="hero-photo.webp" 
        fetchpriority="high" 
        loading="eager" 
        alt="Shop floor comms device diagram" 
        class="hero-image"
      />
    </section>
  </main>

  <!-- Footer Section -->
  <footer>
    <div class="footer-banner-container">
      <img src="footer-photo.webp" loading="lazy" alt="Purpose-Built For The Frontline" class="footer-banner-img" />
    </div>

    <!-- Green PAiGE Brand Block & Socials -->
    <div class="footer-brand-section">
      <img src="apple-touch-logo.png" alt="PAiGE" class="footer-green-logo" />

      <div class="social-links">
        <a href="https://x.com/paigelinkhq" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="X (Twitter)">
          <i class="fa-brands fa-x-twitter"></i>
        </a>
        <a href="https://youtube.com/@paigelinkhq" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="YouTube">
          <i class="fa-brands fa-youtube"></i>
        </a>
        <a href="https://instagram.com/paigelinkhq" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://linkedin.com/company/paigelink" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="LinkedIn">
          <i class="fa-brands fa-linkedin-in"></i>
        </a>
      </div>
    </div>

    <!-- Legal Footer Bar -->
    <div class="footer-bottom">
      <p>&copy; 2026 PAiGE Link LLC. All rights reserved.</p>
      <div class="footer-bottom-links">
        <a href="#privacy">Privacy Policy</a>
        <a href="#terms">Terms of Service</a>
        <a href="#contact">Contact Us</a>
      </div>
    </div>
  </footer>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "paigelink-landing.firebaseapp.com",
      projectId: "paigelink-landing",
      storageBucket: "paigelink-landing.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById('leadForm');
    const emailInput = document.getElementById('emailInput');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value;

      submitBtn.innerText = "SENDING...";
      submitBtn.disabled = true;

      try {
        await addDoc(collection(db, "leads"), {
          email: email,
          timestamp: serverTimestamp()
        });
        alert("Thanks for connecting! We will be in touch shortly.");
        emailInput.value = '';
      } catch (error) {
        console.error("Error submitting lead: ", error);
        alert("There was an issue submitting your request. Please try again.");
      } finally {
        submitBtn.innerText = "CONTACT";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
