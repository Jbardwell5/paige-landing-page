<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAiGE - Frontline &amp; Industrial Communications</title> 
  
  <link rel="apple-touch-icon" href="apple-touch-logo.png">
  <link rel="icon" type="image/png" href="apple-touch-logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Top Navigation Header Bar */
    header {
      background-color: #000000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 3rem;
      border-bottom: 1px solid #1a1a1a;
      position: relative;
    }

    .logo-container {
      display: flex;
      align-items: center;
      flex: 1;
    }

    .logo-img {
      height: 48px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    /* Centered Features, Hardware, and Contact Links */
    .header-main-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      flex: 1;
    }

    /* Right Utility Link: Discreet Admin Login */
    .header-utility-nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex: 1;
    }

    .nav-link {
      color: #a1a1aa;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    .nav-link:hover {
      color: #80E600;
    }

    /* Subtler & Slightly Smaller Admin Login Link */
    .nav-link-admin {
      color: #71717a;
      text-decoration: none;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.2s ease, opacity 0.2s ease;
      opacity: 0.85;
    }

    .nav-link-admin:hover {
      color: #ffffff;
      opacity: 1;
    }

    /* Main Content Layout */
    main {
      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      max-width: 1400px;
      margin: 0 auto;
      min-height: calc(100vh - 130px);
      width: 100%;
    }

    /* Left Column: Hero Content Block */
    .hero-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem 2rem 2rem 5%;
      z-index: 2;
    }

    .hero-text-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      max-width: 580px;
      width: 100%;
    }

    .coming-soon-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(128, 230, 0, 0.08);
      border: 1px solid rgba(128, 230, 0, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 800;
      color: #80E600;
      letter-spacing: 0.08em;
      margin-bottom: 1.75rem;
      margin-left: 0;
    }

    .status-dot {
      font-size: 9px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .hero-text-block h1 {
      font-size: clamp(2.2rem, 4vw, 3.5rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.01em;
      color: #ffffff;
      margin-bottom: 1.75rem;
    }

    .btn-demo-trigger {
      background-color: #80E600;
      color: #050505;
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      padding: 0.95rem 1.9rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.75rem;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px rgba(128, 230, 0, 0.25);
    }

    .btn-demo-trigger:hover {
      background-color: #92fc00;
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 25px rgba(128, 230, 0, 0.45);
    }

    .email-signup-form {
      display: flex;
      align-items: center;
      background-color: #121212;
      border: 1px solid #2a2a2a;
      border-radius: 50px;
      padding: 0.35rem 0.35rem 0.35rem 1.25rem;
      width: 100%;
      max-width: 520px;
      min-height: 52px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .email-signup-form:focus-within {
      border-color: #80E600;
      box-shadow: 0 0 12px rgba(128, 230, 0, 0.15);
    }

    .email-input {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 500;
      width: 100%;
    }

    .email-input::placeholder {
      color: #71717a;
    }

    .submit-btn {
      background-color: #222222;
      color: #e4e4e7;
      border: 1px solid #3f3f46;
      border-radius: 40px;
      padding: 0.7rem 1.4rem;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .submit-btn:hover {
      background-color: #27272a;
      color: #ffffff;
      border-color: #71717a;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .form-success-msg {
      display: none;
      color: #80E600;
      font-size: 0.95rem;
      font-weight: 700;
      width: 100%;
      text-align: center;
      padding: 0.25rem 0.5rem;
      letter-spacing: 0.01em;
    }

    /* Right Column: Hero Image Container */
    .hero-image-container {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at 60% 50%, #111a08 0%, #050505 70%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 500px;
      padding: 2rem 2rem 2rem 0;
    }

    .hero-image {
      width: 100%;
      max-width: 98%;
      height: 100%;
      max-height: 80vh;
      object-fit: contain;
      object-position: right center;
      display: block;
      filter: contrast(1.05) brightness(1.02);
    }

    /* Footer Section */
    footer {
      width: 100%;
      background-color: #0d0d0d;
      border-top: 1px solid #1f1f1f;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .footer-banner-container {
      width: 100%;
      background-color: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem 1rem;
      border-bottom: 1px solid #1a1a1a;
    }

    .footer-banner-img {
      width: 100%;
      max-width: 1200px;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .footer-brand-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.75rem 1.5rem 1rem 1.5rem;
      background-color: #0d0d0d;
      gap: 1rem;
    }

    .footer-green-logo {
      height: 110px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .social-icon {
      color: #71717a;
      font-size: 1.25rem;
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .social-icon:hover {
      color: #ffffff;
      transform: translateY(-2px);
    }

    .footer-bottom {
      width: 100%;
      max-width: 1200px;
      padding: 1rem 2rem 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #52525b;
      font-size: 0.8rem;
      border-top: 1px solid #18181b;
    }

    .footer-bottom-links {
      display: flex;
      gap: 1.25rem;
    }

    .footer-bottom-links a {
      color: #52525b;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-bottom-links a:hover {
      color: #a1a1aa;
    }

    /* Responsive Adjustments */
    @media (max-width: 900px) {
      header {
        padding: 1rem 1.5rem;
        flex-direction: column;
        gap: 1rem;
      }

      .logo-container, .header-main-nav, .header-utility-nav {
        justify-content: center;
        flex: auto;
      }

      .header-main-nav {
        gap: 1.5rem;
      }

      main {
        flex-direction: column;
      }

      .hero-content {
        padding: 3rem 1.5rem;
      }

      .hero-text-block {
        align-items: center;
        text-align: center;
      }

      .hero-image-container {
        min-height: 380px;
        padding: 1rem;
        justify-content: center;
      }

      .hero-image {
        max-width: 100%;
        object-position: center;
      }

      .footer-bottom {
        flex-direction: column;
        gap: 0.75rem;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <header>
  <div class="logo-container">
    <a href="../index.html">
      <img src="../apple-touch-logo.png" alt="PAiGE Logo" class="logo-img" />
    </a>
  </div>

  <nav class="header-main-nav">
    <a href="../features/index.html" class="nav-link">Features</a>
    <a href="../hardware/index.html" class="nav-link">Hardware</a>
    <a href="../contact/index.html" class="nav-link">Contact</a>
  </nav>

  <nav class="header-utility-nav">
    <a href="../admin/index.html" class="nav-link-admin">Admin Login</a>
  </nav>
</header>

  <main>
    <section class="hero-content">
      <div class="hero-text-block">
        
        <div class="coming-soon-badge">
          <span class="status-dot">●</span> COMING SOON
        </div>

        <h1>Modernizing Frontline &amp; Industrial Floor Communication</h1>

        <button id="demoBtn" class="btn-demo-trigger">
          <i class="fa-solid fa-gauge-high"></i> LAUNCH COMMAND CENTER
        </button>

        <form class="email-signup-form" id="leadForm">
          <input 
            type="email" 
            id="emailInput" 
            class="email-input" 
            placeholder="Enter your email for updates..." 
            required 
          />
          <button type="submit" class="submit-btn" id="submitBtn">CONTACT</button>
          
          <div class="form-success-msg" id="successMsg">
            <i class="fa-solid fa-circle-check" style="margin-right: 6px;"></i> Thank you! We'll be in touch shortly.
          </div>
        </form>
      </div>
    </section>

    <section class="hero-image-container">
      <img 
        src="hero-photo.webp" 
        fetchpriority="high" 
        loading="eager" 
        alt="Shop floor comms device diagram" 
        class="hero-image"
      />
    </section>
  </main>

  <footer>
    <div class="footer-banner-container">
      <img src="footer-photo.webp" loading="lazy" alt="Purpose-Built For The Frontline" class="footer-banner-img" />
    </div>

    <div class="footer-brand-section">
      <img src="apple-touch-logo.png" alt="PAiGE" class="footer-green-logo" />

      <div class="social-links">
        <a href="https://x.com/paigelinkhq" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="X (Twitter)">
          <i class="fa-brands fa-x-twitter"></i>
        </a>
        <a href="https://youtube.com/@paigelinkhq" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="YouTube">
          <i class="fa-brands fa-youtube"></i>
        </a>
        <a href="https://instagram.com/paigelinkhq" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://linkedin.com/company/paigelink" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="LinkedIn">
          <i class="fa-brands fa-linkedin-in"></i>
        </a>
      </div>
    </div>

    <div class="footer-bottom">
      <p>&copy; 2026 PAiGE Link LLC. All rights reserved.</p>
      <div class="footer-bottom-links">
        <a href="#privacy">Privacy Policy</a>
        <a href="#terms">Terms of Service</a>
        <a href="contact/">Contact Us</a>
      </div>
    </div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCp0OoxW6kFurcYnKuvQDQ3dSZgXtVpXOE",
      authDomain: "paigelink-landing.firebaseapp.com",
      projectId: "paigelink-landing",
      storageBucket: "paigelink-landing.appspot.com",
      messagingSenderId: "1087272062200",
      appId: "1:1087272062200:web:1a4f43d9a8cb9196c77f0d",
      measurementId: "G-D7YPPK7JQ0"
    };

    // Initialize Firebase Services
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const analytics = getAnalytics(app);

    const form = document.getElementById('leadForm');
    const emailInput = document.getElementById('emailInput');
    const submitBtn = document.getElementById('submitBtn');
    const successMsg = document.getElementById('successMsg');
    const demoBtn = document.getElementById('demoBtn');

    // Launch Dashboard Handler
    const launchDemo = () => {
      logEvent(analytics, 'launch_demo', { source: 'hero_button' });
      window.location.href = 'dashboard/#demo';
    };

    demoBtn.addEventListener('click', launchDemo);

    // Auto-launch if someone opens paigelink.com/#demo directly
    if (window.location.hash === '#demo') {
      launchDemo();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value;

      submitBtn.innerText = "SENDING...";
      submitBtn.disabled = true;

      try {
        await addDoc(collection(db, "leads"), {
          email: email,
          timestamp: serverTimestamp()
        });

        // Log custom lead conversion event in Firebase Analytics
        logEvent(analytics, 'generate_lead', {
          method: 'landing_page_form'
        });

        // Hide input and button, then reveal the green bubble message
        emailInput.style.display = 'none';
        submitBtn.style.display = 'none';
        form.style.padding = '0.85rem 1.25rem';
        form.style.borderColor = '#80E600';
        successMsg.style.display = 'block';

      } catch (error) {
        console.error("Error submitting lead: ", error);
        submitBtn.innerText = "CONTACT";
        submitBtn.disabled = false;
        alert("There was an issue submitting your request. Please try again.");
      }
    });
  </script>
</body>
</html>
