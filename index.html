<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAiGE - Frontline & Industrial Communications</title>
  
  <!-- Apple Touch Icon & Favicon -->
  <link rel="apple-touch-icon" href="apple-touch-logo.png">
  <link rel="icon" type="image/png" href="apple-touch-logo.png">

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome CDN for Social Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Header Navigation */
    header {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0.75rem 2rem;
      border-bottom: 1px solid #1a1a1a;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-img {
      height: 100px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    /* Main Content Layout */
    main {
      flex: 1;
      display: flex;
      flex-direction: row;
      min-height: calc(100vh - 110px);
      align-items: center;
    }

    /* Left Column: Hero Content (Slightly narrower to give room to image) */
    .hero-content {
      flex: 0 0 42%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 4rem 2% 4rem 5%;
      z-index: 2;
    }

    .hero-content h1 {
      font-size: clamp(3.2rem, 5.5vw, 5.5rem);
      font-weight: 800;
      line-height: 0.95;
      margin-bottom: 1.5rem;
      letter-spacing: -0.04em;
      color: #ffffff;
    }

    .hero-content h2 {
      color: #80E600;
      font-size: clamp(1.4rem, 2.4vw, 2.25rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      max-width: 580px;
    }

    /* Form & Wrapper */
    .form-wrapper {
      width: 100%;
      max-width: 480px;
      margin-top: 2.25rem;
    }

    .email-signup-form {
      display: flex;
      align-items: center;
      background-color: #161616;
      border: 1px solid #333333;
      border-radius: 50px;
      padding: 0.35rem 0.35rem 0.35rem 1.25rem;
      width: 100%;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .email-signup-form:focus-within {
      border-color: #80E600;
      box-shadow: 0 0 12px rgba(128, 230, 0, 0.2);
    }

    .email-input {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 500;
      width: 100%;
      min-width: 0;
    }

    .email-input::placeholder {
      color: #666666;
    }

    .submit-btn {
      background-color: #80E600;
      color: #050505;
      border: none;
      border-radius: 40px;
      padding: 0.75rem 1.75rem;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .submit-btn:hover {
      background-color: #92fc00;
      transform: scale(1.02);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    /* Modern Success Message */
    .success-message {
      color: #80E600;
      font-size: 0.9rem;
      font-weight: 700;
      margin-top: 0.85rem;
      padding-left: 0.5rem;
      text-align: left;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Right Column: Hero Image (Expanded 20% wider) */
    .hero-image-container {
      flex: 0 0 58%;
      position: relative;
      background-color: #050505;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 500px;
      padding: 2rem 2rem 2rem 0;
    }

    .hero-image {
      width: 100%;
      max-width: 100%;
      height: auto;
      max-height: 85vh;
      object-fit: contain;
      object-position: center;
      display: block;
    }

    /* Footer Section */
    footer {
      width: 100%;
      background-color: #0d0d0d;
      border-top: 1px solid #1f1f1f;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .footer-banner-container {
      width: 100%;
      background-color: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem 1rem;
      border-bottom: 1px solid #1a1a1a;
    }

    .footer-banner-img {
      width: 100%;
      max-width: 1200px;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .footer-brand-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.75rem 1.5rem 1rem 1.5rem;
      background-color: #0d0d0d;
      gap: 1rem;
    }

    .footer-green-logo {
      height: 125px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .social-icon {
      color: #71717a;
      font-size: 1.25rem;
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .social-icon:hover {
      color: #ffffff;
      transform: translateY(-2px);
    }

    .footer-bottom {
      width: 100%;
      max-width: 1200px;
      padding: 1rem 2rem 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #52525b;
      font-size: 0.8rem;
      border-top: 1px solid #18181b;
    }

    .footer-bottom-links {
      display: flex;
      gap: 1.25rem;
    }

    .footer-bottom-links a {
      color: #52525b;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-bottom-links a:hover {
      color: #a1a1aa;
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 900px) {
      header {
        padding: 0.5rem 1rem;
      }

      .logo-img {
        height: 55px;
      }

      main {
        flex-direction: column;
        min-height: auto;
      }

      .hero-content {
        flex: 1 1 100%;
        padding: 2.5rem 1.25rem 1.5rem 1.25rem;
        align-items: center;
        text-align: center;
      }

      .hero-content h1 {
        font-size: 2.75rem;
        margin-bottom: 1rem;
      }

      .hero-content h2 {
        font-size: 1.35rem;
      }

      .form-wrapper {
        margin-top: 1.75rem;
      }

      .email-signup-form {
        padding: 0.25rem 0.25rem 0.25rem 1rem;
      }

      .email-input {
        font-size: 0.85rem;
      }

      .submit-btn {
        padding: 0.65rem 1.25rem;
        font-size: 0.75rem;
      }

      .success-message {
        text-align: center;
        padding-left: 0;
      }

      .hero-image-container {
        flex: 1 1 100%;
        min-height: 340px;
        padding: 1rem;
      }

      .hero-image {
        max-width: 100%;
      }

      .footer-green-logo {
        height: 80px;
      }

      .footer-bottom {
        flex-direction: column;
        gap: 0.75rem;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="logo-container">
      <a href="#">
        <img src="apple-touch-logo.png" alt="PAiGE Logo" class="logo-img" />
      </a>
    </div>
  </header>

  <!-- Hero Section -->
  <main>
    <!-- Left Column: Copy & Email Capture -->
    <section class="hero-content">
      <h1>Coming Soon</h1>
      <h2>Modernizing Frontline &amp; Industrial Floor Communication</h2>

      <div class="form-wrapper">
        <form class="email-signup-form" id="leadForm">
          <input 
            type="email" 
            id="emailInput"
            class="email-input" 
            placeholder="Enter your email to learn more..." 
            required 
          />
          <button type="submit" class="submit-btn" id="submitBtn">CONTACT</button>
        </form>
        <div id="formSuccess" class="success-message" style="display: none;">
          ✓ Thanks for connecting! We will be in touch shortly.
        </div>
      </div>
    </section>

    <!-- Right Column: Product Image -->
    <section class="hero-image-container">
      <img 
        src="hero-photo.webp" 
        fetchpriority="high" 
        loading="eager" 
        alt="Industrial Floor Communication Device Diagram" 
        class="hero-image"
      />
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-banner-container">
      <img src="footer-photo.webp" loading="lazy" alt="Purpose-Built For The Frontline" class="footer-banner-img" />
    </div>

    <div class="footer-brand-section">
      <img src="apple-touch-logo.png" alt="PAiGE" class="footer-green-logo" />

      <div class="social-links">
        <a href="https://x.com/paigelinkhq" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="X (Twitter)">
          <i class="fa-brands fa-x-twitter"></i>
        </a>
        <a href="https://youtube.com/@paigelinkhq" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="YouTube">
          <i class="fa-brands fa-youtube"></i>
        </a>
        <a href="https://instagram.com/paigelinkhq" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://linkedin.com/company/paigelink" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="LinkedIn">
          <i class="fa-brands fa-linkedin-in"></i>
        </a>
      </div>
    </div>

    <div class="footer-bottom">
      <p>&copy; 2026 PAiGE Link LLC. All rights reserved.</p>
      <div class="footer-bottom-links">
        <a href="#privacy">Privacy Policy</a>
        <a href="#terms">Terms of Service</a>
        <a href="#contact">Contact Us</a>
      </div>
    </div>
  </footer>

  <!-- Firebase Script Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCp0OoXW6kFurcYnKuvQDQ3dSZgXtVpXOE",
      authDomain: "paigelink-landing.firebaseapp.com",
      projectId: "paigelink-landing",
      storageBucket: "paigelink-landing.firebasestorage.app",
      messagingSenderId: "1087272062200",
      appId: "1:1087272062200:web:170e73754c69b29fc77f0d",
      measurementId: "G-1KS7LRCVQ4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById('leadForm');
    const emailInput = document.getElementById('emailInput');
    const submitBtn = document.getElementById('submitBtn');
    const successMsg = document.getElementById('formSuccess');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value;

      submitBtn.innerText = "SENDING...";
      submitBtn.disabled = true;

      try {
        await addDoc(collection(db, "leads"), {
          email: email,
          timestamp: serverTimestamp()
        });

        emailInput.value = '';
        submitBtn.innerText = "SENT!";
        successMsg.style.display = "block";
        
        setTimeout(() => {
          submitBtn.innerText = "CONTACT";
          submitBtn.disabled = false;
        }, 4000);

      } catch (error) {
        console.error("Error submitting lead: ", error);
        alert("There was an issue submitting your request. Please try again.");
        submitBtn.innerText = "CONTACT";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
