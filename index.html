<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAiGE - Frontline &amp; Industrial Communications</title>
  
  <!-- Apple Touch Icon & Favicon -->
  <link rel="apple-touch-icon" href="apple-touch-logo.png">
  <link rel="icon" type="image/png" href="apple-touch-logo.png">

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome CDN for Social Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Header Navigation */
    header {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0.75rem 2rem;
      border-bottom: 1px solid #1a1a1a;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-img {
      height: 100px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    /* Main Content Layout */
    main {
      flex: 1;
      display: flex;
      flex-direction: row;
      min-height: calc(100vh - 110px);
      width: 100%;
    }

    /* Left Column: Hero Content Block */
    .hero-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3rem 4%;
      z-index: 2;
    }

    /* Inner Wrapper */
    .hero-text-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      max-width: 620px;
      width: 100%;
    }

    /* Coming Soon Pill Badge */
    .coming-soon-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: rgba(128, 230, 0, 0.08);
      border: 1px solid rgba(128, 230, 0, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      color: #80E600;
      letter-spacing: 0.08em;
      margin-bottom: 1.25rem;
    }

    .status-dot {
      font-size: 9px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* Clean White Main Headline */
    .hero-text-block h1 {
      font-size: clamp(2.2rem, 4vw, 3.5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      color: #ffffff;
      margin-bottom: 1.5rem;
    }

    /* Primary CTA Button: Launch Admin Dashboard */
    .btn-demo-trigger {
      background-color: #80E600;
      color: #050505;
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      padding: 0.9rem 1.8rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.25rem;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px rgba(128, 230, 0, 0.25);
    }

    .btn-demo-trigger:hover {
      background-color: #92fc00;
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 25px rgba(128, 230, 0, 0.45);
    }

    /* Form Bubble Container */
    .email-signup-form {
      margin-top: 0.25rem;
      display: flex;
      align-items: center;
      background-color: #161616;
      border: 1px solid #333333;
      border-radius: 50px;
      padding: 0.35rem 0.35rem 0.35rem 1.25rem;
      width: 100%;
      max-width: 480px;
      min-height: 52px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .email-signup-form:focus-within {
      border-color: #80E600;
      box-shadow: 0 0 12px rgba(128, 230, 0, 0.2);
    }

    .email-input {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 500;
      width: 100%;
    }

    .email-input::placeholder {
      color: #666666;
    }

    .submit-btn {
      background-color: #80E600;
      color: #050505;
      border: none;
      border-radius: 40px;
      padding: 0.75rem 1.75rem;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      white-space: nowrap;
    }

    .submit-btn:hover {
      background-color: #92fc00;
      transform: scale(1.02);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    /* Inline Thank You Message inside Bubble */
    .form-success-msg {
      display: none;
      color: #80E600;
      font-size: 0.95rem;
      font-weight: 700;
      width: 100%;
      text-align: center;
      padding: 0.25rem 0.5rem;
      letter-spacing: 0.01em;
    }

    /* Right Column: Hero Image */
    .hero-image-container {
      flex: 1;
      position: relative;
      background-color: #050505;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 500px;
      padding: 1.5rem 1rem 1.5rem 0;
    }

    .hero-image {
      width: 100%;
      max-width: 98%;
      height: 100%;
      max-height: 92vh;
      object-fit: contain;
      object-position: right center;
      display: block;
    }

    /* Footer Section */
    footer {
      width: 100%;
      background-color: #0d0d0d;
      border-top: 1px solid #1f1f1f;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .footer-banner-container {
      width: 100%;
      background-color: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem 1rem;
      border-bottom: 1px solid #1a1a1a;
    }

    .footer-banner-img {
      width: 100%;
      max-width: 1200px;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .footer-brand-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.75rem 1.5rem 1rem 1.5rem;
      background-color: #0d0d0d;
      gap: 1rem;
    }

    .footer-green-logo {
      height: 125px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .social-icon {
      color: #71717a;
      font-size: 1.25rem;
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .social-icon:hover {
      color: #ffffff;
      transform: translateY(-2px);
    }

    .footer-bottom {
      width: 100%;
      max-width: 1200px;
      padding: 1rem 2rem 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #52525b;
      font-size: 0.8rem;
      border-top: 1px solid #18181b;
    }

    .footer-bottom-links {
      display: flex;
      gap: 1.25rem;
    }

    .footer-bottom-links a {
      color: #52525b;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-bottom-links a:hover {
      color: #a1a1aa;
    }

    /* Responsive Adjustments */
    @media (max-width: 900px) {
      main {
        flex-direction: column;
      }

      .hero-content {
        padding: 3rem 1.5rem;
      }

      .hero-text-block {
        align-items: center;
        text-align: center;
      }

      .hero-image-container {
        min-height: 380px;
        padding: 1rem;
        justify-content: center;
      }

      .hero-image {
        max-width: 100%;
        object-position: center;
      }

      .footer-bottom {
        flex-direction: column;
        gap: 0.75rem;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Minimal Header Navigation -->
  <header>
    <div class="logo-container">
      <a href="#">
        <img src="apple-touch-logo.png" alt="PAiGE Logo" class="logo-img" />
      </a>
    </div>
  </header>

  <!-- Split Hero Section -->
  <main>
    <!-- Left Column -->
    <section class="hero-content">
      <div class="hero-text-block">
        
        <!-- Subtle Green Pill Badge -->
        <div class="coming-soon-badge">
          <span class="status-dot">●</span> COMING SOON
        </div>

        <!-- Clean White Main Headline -->
        <h1>Modernizing Frontline &amp; Industrial Floor Communication</h1>

        <!-- Primary CTA: Launch Admin Dashboard -->
        <button id="demoBtn" class="btn-demo-trigger">
          <i class="fa-solid fa-gauge-high"></i> LAUNCH ADMIN DASHBOARD
        </button>

        <!-- Secondary Email Capture -->
        <form class="email-signup-form" id="leadForm">
          <input 
            type="email" 
            id="emailInput" 
            class="email-input" 
            placeholder="Enter your email to learn more..." 
            required 
          />
          <button type="submit" class="submit-btn" id="submitBtn">CONTACT</button>
          
          <!-- Success Message Container -->
          <div class="form-success-msg" id="successMsg">
            <i class="fa-solid fa-circle-check" style="margin-right: 6px;"></i> Thank you! We'll be in touch shortly.
          </div>
        </form>
      </div>
    </section>

    <!-- Right Column -->
    <section class="hero-image-container">
      <img 
        src="hero-photo.webp" 
        fetchpriority="high" 
        loading="eager" 
        alt="Shop floor comms device diagram" 
        class="hero-image"
      />
    </section>
  </main>

  <!-- Footer Section -->
  <footer>
    <div class="footer-banner-container">
      <img src="footer-photo.webp" loading="lazy" alt="Purpose-Built For The Frontline" class="footer-banner-img" />
    </div>

    <!-- Green PAiGE Brand Block & Socials -->
    <div class="footer-brand-section">
      <img src="apple-touch-logo.png" alt="PAiGE" class="footer-green-logo" />

      <div class="social-links">
        <a href="https://x.com/paigelinkhq" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="X (Twitter)">
          <i class="fa-brands fa-x-twitter"></i>
        </a>
        <a href="https://youtube.com/@paigelinkhq" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="YouTube">
          <i class="fa-brands fa-youtube"></i>
        </a>
        <a href="https://instagram.com/paigelinkhq" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://linkedin.com/company/paigelink" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="LinkedIn">
          <i class="fa-brands fa-linkedin-in"></i>
        </a>
      </div>
    </div>

    <!-- Legal Footer Bar -->
    <div class="footer-bottom">
      <p>&copy; 2026 PAiGE Link LLC. All rights reserved.</p>
      <div class="footer-bottom-links">
        <a href="#privacy">Privacy Policy</a>
        <a href="#terms">Terms of Service</a>
        <a href="#contact">Contact Us</a>
      </div>
    </div>
  </footer>

  <!-- Firebase & Analytics Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCp0OoxW6kFurcYnKuvQDQ3dSZgXtVpXOE",
      authDomain: "paigelink-landing.firebaseapp.com",
      projectId: "paigelink-landing",
      storageBucket: "paigelink-landing.appspot.com",
      messagingSenderId: "1087272062200",
      appId: "1:1087272062200:web:1a4f43d9a8cb9196c77f0d",
      measurementId: "G-D7YPPK7JQ0"
    };

    // Initialize Firebase Services
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const analytics = getAnalytics(app);

    const form = document.getElementById('leadForm');
    const emailInput = document.getElementById('emailInput');
    const submitBtn = document.getElementById('submitBtn');
    const successMsg = document.getElementById('successMsg');
    const demoBtn = document.getElementById('demoBtn');

    // Launch Dashboard Handler
    const launchDemo = () => {
      logEvent(analytics, 'launch_demo', { source: 'hero_button' });
      window.location.href = '/dashboard#demo';
    };

    demoBtn.addEventListener('click', launchDemo);

    // Auto-launch if someone opens paigelink.com/#demo directly
    if (window.location.hash === '#demo') {
      launchDemo();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value;

      submitBtn.innerText = "SENDING...";
      submitBtn.disabled = true;

      try {
        await addDoc(collection(db, "leads"), {
          email: email,
          timestamp: serverTimestamp()
        });

        // Log custom lead conversion event in Firebase Analytics
        logEvent(analytics, 'generate_lead', {
          method: 'landing_page_form'
        });

        // Hide input and button, then reveal the green bubble message
        emailInput.style.display = 'none';
        submitBtn.style.display = 'none';
        form.style.padding = '0.85rem 1.25rem';
        form.style.borderColor = '#80E600';
        successMsg.style.display = 'block';

      } catch (error) {
        console.error("Error submitting lead: ", error);
        submitBtn.innerText = "CONTACT";
        submitBtn.disabled = false;
        alert("There was an issue submitting your request. Please try again.");
      }
    });
  </script>
</body>
</html>
