<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAIGE - Coming Soon</title>
  
  <!-- Apple Touch Icon & Favicon -->
  <link rel="apple-touch-icon" href="apple-touch-logo.png">
  <link rel="icon" type="image/png" href="apple-touch-logo.png">

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome CDN for Social Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Navigation Bar (Grid layout for perfect centering) */
    header {
      background-color: #161616;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 1rem 2rem;
      border-bottom: 1px solid #222222;
    }

    .header-left {
      /* Empty placeholder to balance the grid */
    }

    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-img {
      height: 125px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    /* Header Navigation Right Group */
    .header-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 1.5rem;
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .social-icon {
      color: #71717a;
      font-size: 1.2rem;
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .social-icon:hover {
      color: #ffffff;
      transform: translateY(-1px);
    }

    .nav-link {
      color: #71717a;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s ease;
      margin-left: 0.25rem;
    }

    .nav-link:hover {
      color: #ffffff;
    }

    /* Main Content Layout */
    main {
      flex: 1;
      display: flex;
      flex-direction: row;
      min-height: calc(100vh - 80px);
    }

    /* Left Column: Typography */
    .hero-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 4rem 5%;
      z-index: 2;
    }

    .hero-content h1 {
      font-size: clamp(3.5rem, 6.5vw, 6rem);
      font-weight: 800;
      line-height: 0.95;
      margin-bottom: 1.75rem;
      letter-spacing: -0.04em;
      color: #ffffff;
    }

    .hero-content h2 {
      color: #80E600;
      font-size: clamp(1.5rem, 2.75vw, 2.5rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      max-width: 620px;
    }

    /* Right Column: Hero Image */
    .hero-image-container {
      flex: 1;
      position: relative;
      background-color: #0d0d0d;
      overflow: hidden;
      min-height: 400px;
    }

    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Full-Width Footer Section */
    footer {
      width: 100%;
      background-color: #0a0a0a;
      border-top: 1px solid #1f1f1f;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .footer-banner-container {
      width: 100%;
      background-color: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3rem 1.5rem;
      border-bottom: 1px solid #1a1a1a;
    }

    .footer-banner-img {
      width: 100%;
      max-width: 1200px; /* Constrains image on ultra-wide screens while staying full-width responsive */
      height: auto;
      display: block;
      object-fit: contain;
    }

    .footer-bottom {
      width: 100%;
      max-width: 1200px;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #52525b;
      font-size: 0.85rem;
    }

    .footer-bottom-links {
      display: flex;
      gap: 1.5rem;
    }

    .footer-bottom-links a {
      color: #52525b;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-bottom-links a:hover {
      color: #a1a1aa;
    }

    /* Responsive Adjustments */
    @media (max-width: 900px) {
      header {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1rem 1.5rem;
      }
      
      .header-right {
        justify-content: center;
      }

      main {
        flex-direction: column;
      }

      .hero-content {
        padding: 4rem 2rem;
        align-items: center;
        text-align: center;
      }

      .hero-image-container {
        min-height: 350px;
      }

      .footer-banner-container {
        padding: 2rem 1rem;
      }

      .footer-bottom {
        flex-direction: column;
        gap: 1rem;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Header Navigation -->
  <header>
    <div class="header-left"></div>

    <div class="logo-container">
      <a href="#">
        <img src="apple-touch-logo.png" alt="PAiGE Logo" class="logo-img" />
      </a>
    </div>

    <div class="header-right">
      <div class="social-links">
        <a href="https://x.com/paigelinkhq" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="X (Twitter)">
          <i class="fa-brands fa-x-twitter"></i>
        </a>
        <a href="https://youtube.com/@paigelinkhq" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="YouTube">
          <i class="fa-brands fa-youtube"></i>
        </a>
        <a href="https://instagram.com/paigelinkhq" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://linkedin.com/company/paigelink" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="LinkedIn">
          <i class="fa-brands fa-linkedin-in"></i>
        </a>
      </div>

      <a href="#login" class="nav-link">Login</a>
    </div>
  </header>

  <!-- Split Hero Section -->
  <main>
    <!-- Left Column -->
    <section class="hero-content">
      <h1>Coming Soon</h1>
      <h2>Modernizing Frontline &amp; Industrial Floor Communication</h2>
    </section>

    <!-- Right Column -->
    <section class="hero-image-container">
      <img src="hero-photo.png" alt="Industrial floor communication" class="hero-image" />
    </section>
  </main>

  <!-- Full-Width Footer Section -->
  <footer>
    <div class="footer-banner-container">
      <img src="footer-photo.jpg" alt="Purpose-Built For The Frontline" class="footer-banner-img" />
    </div>
    
    <div class="footer-bottom">
      <p>&copy; 2026 PAiGE Link Inc. All rights reserved.</p>
      <div class="footer-bottom-links">
        <a href="#privacy">Privacy Policy</a>
        <a href="#terms">Terms of Service</a>
        <a href="#contact">Contact Us</a>
      </div>
    </div>
  </footer>

</body>
</html>
